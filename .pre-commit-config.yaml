repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
    -   id: black
-   repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
    -   id: isort
        name: isort (python)
-   repo: local
    hooks:
    -   id: pytest-cov
        name: pytest-cov
        entry: pytest
        args: ["--cov=src"]
        language: system
        pass_filenames: false
        always_run: true
