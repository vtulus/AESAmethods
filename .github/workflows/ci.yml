name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-uv
      - run: uvx ruff@0.17.5 check . --exclude notebooks
      - run: uvx ruff@0.17.5 format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest
